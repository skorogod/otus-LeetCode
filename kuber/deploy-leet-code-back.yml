apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minimal-Ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "yc-clusterissuer"
spec:
  tls:
    - hosts:
      - otus-kuber.skorogod.ru
      secretName: domain-name-secret 
  rules:
    - host: otus-kuber.skorogod.ru
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: leet-code-service
              port:
                number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: leet-code-service
spec:
  selector:
    app: leet-code-back
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 3000
---
apiVersion: apps/1
kind: Deployment
metadata:
  name: leet-code-back-Deployment
  labels:
    app: leet-code-back 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leet-code-back
  template:
    metadata:
      labels:
        app: leet-code-back
    spec:
      containers:
      - name: leet-code-back
        image: markus777/leet-code-back
        ports:
          - containerPort: 3000
