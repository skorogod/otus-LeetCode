# db-persistent-volume.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: leet-code-persistent-volume
  labels:
    type: local
spec:
  claimRef:
    namespace: default
    name: leet-code-persistent-volume-claim
  storageClassName: yc-network-hdd
  capacity:
    storage: 3Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "C://data"